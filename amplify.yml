version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node --version
        - npm --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - NEXT_PUBLIC_SITE_URL=https://www.levon.blog npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
